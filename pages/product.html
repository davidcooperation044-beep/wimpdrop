<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Wimp-Drop</title>
    <meta name="description" content="Shop premium products from Wimp-Drop with secure checkout, transparent pricing, and live stock details.">
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="Wimp-Drop Product Details">
    <meta property="og:description" content="View details, shipping origin, and pricing for premium products on Wimp-Drop.">
    <meta property="og:type" content="product">
    <meta property="og:image" content="/images/wimp.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://wimpdrop.com.ng/pages/product.html">
    <link rel="icon" type="image/png" href="/images/wimp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/luxury-theme.css">
    <link rel="stylesheet" href="/css/shop-browse.css">
    <link rel="stylesheet" href="/css/product-page.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification-container"></div>

    <header class="site-header" data-shared-header></header>

    <main class="pd-page">
        <p id="pd-loading" class="pd-state" role="status">Loading product…</p>
        <div id="pd-root" hidden>
            <nav id="pd-crumbs" class="pd-crumbs" aria-label="Breadcrumb"></nav>

            <div class="pd-layout">
                <section class="pd-panel" aria-label="Product images">
                    <div class="pd-stage" id="pd-stage">
                        <img id="pd-main-img" src="" alt="">
                        <button type="button" class="pd-nav prev" id="pd-prev" aria-label="Previous image" hidden>&#8249;</button>
                        <button type="button" class="pd-nav next" id="pd-next" aria-label="Next image" hidden>&#8250;</button>
                    </div>
                    <div class="pd-thumbs" id="pd-thumbs"></div>
                </section>

                <section class="pd-panel" aria-label="Product options">
                    <div class="pd-cat" id="pd-cat"></div>
                    <h1 class="pd-title" id="pd-title"></h1>
                    <div class="pd-rating" id="pd-rating" hidden></div>
                    <div class="pd-price" id="pd-price"></div>
                    <div class="pd-stock" id="pd-stock" role="status" aria-live="polite"></div>
                    <p class="pd-blurb" id="pd-blurb" hidden></p>

                    <div id="pd-variants"></div>

                    <div class="pd-buy">
                        <div class="pd-qty" role="group" aria-label="Quantity">
                            <button type="button" id="pd-dec" aria-label="Decrease quantity">&minus;</button>
                            <output id="pd-qty-val" aria-live="polite">1</output>
                            <button type="button" id="pd-inc" aria-label="Increase quantity">+</button>
                        </div>
                        <button type="button" class="pd-btn primary" id="pd-add">Add to cart</button>
                    </div>
                    <div class="pd-buy">
                        <button type="button" class="pd-btn primary" id="pd-buy-now">Buy now</button>
                        <button type="button" class="pd-btn" id="pd-wish" aria-pressed="false">&#9825; Save</button>
                    </div>

                    <div class="pd-info">
                        <h2>Delivery</h2>
                        <p>Shipping method and cost are shown at checkout, where you can choose standard or express.</p>
                        <p>Prices are in Nigerian Naira. Payment is processed securely through Flutterwave.</p>
                    </div>
                </section>
            </div>

            <div class="pd-details">
                <section class="pd-panel" id="pd-about">
                    <h2>About this item</h2>
                    <p class="pd-desc" id="pd-desc"></p>
                </section>
                <section class="pd-panel">
                    <h2>Details</h2>
                    <table class="pd-specs">
                        <tbody>
                            <tr><th scope="row">SKU</th><td id="pd-sku">-</td></tr>
                        </tbody>
                    </table>
                </section>
            </div>

            <section class="pd-more" id="pd-more" aria-labelledby="pd-more-title">
                <div class="pd-more-head">
                    <h2 id="pd-more-title">More to explore</h2>
                    <a id="pd-more-all" href="/pages/shop.html">See all</a>
                </div>
                <div class="sb-grid" id="pd-more-grid"></div>
            </section>
        </div>
    </main>

    <div class="pd-sticky" id="pd-sticky">
        <div class="pd-sticky-inner">
            <div class="pd-sticky-price"><small>Price</small><strong id="pd-sticky-price">-</strong></div>
            <button type="button" class="pd-btn primary" id="pd-sticky-btn">Add to cart</button>
        </div>
    </div>

    <footer data-shared-footer></footer>

    <script src="/js/runtime-env.js"></script>
    <script src="/js/env.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/flutterwave.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/luxury-ui.js"></script>
    <script src="/js/product-page.js"></script>
</body>
</html>
