<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wimp-Drop</title>
    <link rel="icon" type="image/png" href="/images/wimp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/luxury-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification-container"></div>

    <header class="site-header" data-shared-header></header>

    <section class="section auth-page">
        <div class="container auth-shell auth-shell-single">
            <div class="auth-card auth-card-compact">
                <div class="auth-card-header text-center">
                    <span class="eyebrow">Welcome back</span>
                    <h2>Sign in</h2>
                    <p>Access your orders, wishlist, and saved preferences in one place.</p>
                </div>

                <div id="login-feedback" class="auth-feedback" role="status" aria-live="polite"></div>

                <form id="login-form" onsubmit="handleLoginForm(event)">
                    <div class="form-group">
                        <label for="login-email">Email address</label>
                        <input id="login-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="auth-input-wrap">
                            <input id="login-password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button class="auth-toggle" type="button" data-toggle-password="login-password">Show</button>
                        </div>
                    </div>

                    <div class="form-group auth-inline-row">
                        <a href="/pages/forgot-password.html" class="text-link">Forgot password?</a>
                    </div>

                    <div class="auth-divider"><span>or</span></div>
                    <button type="button" class="btn btn-outline btn-block oauth-btn" onclick="handleOAuthLogin('google')">Continue with Google</button>
                    <button id="login-submit" type="submit" class="btn btn-primary btn-block btn-large">Sign in</button>
                </form>

                <p class="auth-footer">
                    New here? <a href="/pages/register.html" class="text-link">Create an account</a>
                </p>
            </div>
        </div>
    </section>

    <footer data-shared-footer></footer>
<script>
        function setLoginFeedback(message, type = 'info') {
            const feedback = document.getElementById('login-feedback');
            if (!feedback) return;
            feedback.textContent = message;
            feedback.className = `auth-feedback ${type}`.trim();
        }

        document.querySelectorAll('.auth-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-toggle-password');
                const input = document.getElementById(targetId);
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                button.textContent = isPassword ? 'Hide' : 'Show';
            });
        });

        async function handleOAuthLogin(provider) {
            setLoginFeedback('');
            try {
                if (window._supabaseReady) {
                    await window._supabaseReady;
                }

                if (!window._supabase?.auth?.signInWithOAuth) {
                    throw new Error('Auth service is not available.');
                }

                const { error } = await window._supabase.auth.signInWithOAuth({
                    provider,
                    options: {
                        redirectTo: `${window.location.origin}/pages/account.html`
                    }
                });

                if (error) throw error;

            } catch (error) {
                const msg = (error?.message || error || 'Google sign-in failed').toString();
                setLoginFeedback(`We could not start Google sign-in: ${msg}`, 'error');
            }
        }

        async function handleLoginForm(event) {
            event.preventDefault();
            const email = document.querySelector('input[name="email"]').value.trim();
            const password = document.querySelector('input[name="password"]').value;
            const btn = document.getElementById('login-submit');

            setLoginFeedback('');

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setLoginFeedback('Please enter a valid email address.', 'error');
                return;
            }

            btn.classList.add('is-loading');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                if (window._supabaseReady) {
                    await window._supabaseReady;
                }

                let result;
                if (typeof handleLogin === 'function') {
                    result = await handleLogin(email, password);
                } else if (window._supabase?.auth?.signInWithPassword) {
                    result = await window._supabase.auth.signInWithPassword({ email, password });
                    if (result.error) {
                        throw result.error;
                    }
                } else {
                    throw new Error('Auth service is not available.');
                }

                const success = result?.success ?? !!result?.data;
                if (!success) {
                    throw new Error(result?.error?.message || result?.error || 'Login failed');
                }

                setLoginFeedback('Welcome back — redirecting to your account.', 'success');
                setTimeout(() => window.location.href = 'account.html', 800);
            } catch (error) {
                const msg = (error?.message || error || 'Login failed').toString();
                const friendly = msg.toLowerCase().includes('invalid') || msg.toLowerCase().includes('password') || msg.toLowerCase().includes('credentials')
                    ? "That email or password doesn't match our records."
                    : 'We could not sign you in right now. Please try again.';
                setLoginFeedback(friendly, 'error');
            } finally {
                btn.classList.remove('is-loading');
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }
    </script>
    <script src="/js/runtime-env.js"></script>
    <script src="/js/env.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/flutterwave.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/luxury-ui.js"></script>
</body>
</html>
