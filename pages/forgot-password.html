<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Wimp-Drop</title>
    <link rel="icon" type="image/png" href="/images/wimp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/luxury-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notification-container"></div>

    <header class="site-header" data-shared-header></header>

    <section class="section auth-page">
        <div class="container auth-container">
            <div class="auth-card">
                <div class="auth-card-header text-center">
                    <span class="eyebrow">Password recovery</span>
                    <h1>Reset your password</h1>
                    <p>Enter the email linked to your account and weâ€™ll send a secure reset link.</p>
                </div>

                <div class="auth-note">
                    If your email exists in our system, a reset link will be emailed to you shortly.
                </div>

                <form id="forgot-password-form" onsubmit="handleForgotPassword(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-large">Send reset link</button>
                </form>

                <p class="auth-footer">
                    <a href="/pages/login.html">Back to sign in</a>
                </p>
            </div>
        </div>
    </section>

    <footer data-shared-footer></footer>
<script>
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.querySelector('input[name="email"]').value.trim();
            const btn = document.querySelector('button[type="submit"]');

            if (!email) {
                showNotification('Please enter your email address.', 'error');
                return;
            }

            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                if (window._supabaseReady) {
                    await window._supabaseReady;
                }

                let result;
                if (typeof window._supabase?.auth?.resetPasswordForEmail === 'function') {
                    result = await window._supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: `${window.location.origin}/pages/reset-password.html`
                    });
                } else if (typeof window._supabase?.resetPassword === 'function') {
                    result = await window._supabase.resetPassword(email);
                } else {
                    throw new Error('Password reset service is not available.');
                }

                if (result?.error) {
                    throw result.error;
                }

                showNotification('If an account exists for that email, a reset link has been sent.', 'success');
                document.getElementById('forgot-password-form').reset();
            } catch (error) {
                const msg = (error?.message || error || 'Could not send reset link').toString();
                showNotification(msg, 'error');
            } finally {
                btn.textContent = 'Send reset link';
                btn.disabled = false;
            }
        }
    </script>
    <script src="/js/runtime-env.js"></script>
    <script src="/js/env.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/flutterwave.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/luxury-ui.js"></script>
</body>
</html>
