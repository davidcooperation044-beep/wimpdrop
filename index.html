<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wimp-Drop | Premium Marketplace</title>
    <link rel="icon" type="image/png" href="/images/wimp.png">
    <meta name="description" content="Discover premium essentials, gadgets, and curated drops from Wimp-Drop with secure checkout and origin-aware delivery.">
    <meta name="theme-color" content="#d4af37">
    <meta name="robots" content="index,follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Wimp-Drop | Premium Marketplace">
    <meta property="og:description" content="Premium products, secure checkout, and transparent shipping from a trusted global catalog.">
    <meta property="og:image" content="/images/wimp.png">
    <meta property="og:url" content="https://wimpdrop.com.ng/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wimp-Drop | Premium Marketplace">
    <meta name="twitter:description" content="Browse curated premium essentials and gadgets with secure checkout and real-time stock visibility.">
    <link rel="canonical" href="https://wimpdrop.com.ng/">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/luxury-theme.css">
    <link rel="stylesheet" href="/css/shop-browse.css">
    <link rel="stylesheet" href="/css/home-browse.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="notification-container"></div>


    <header class="site-header" data-shared-header></header>


    <main id="home-browse" aria-label="Storefront"></main>

    <div class="hm-trust" style="width:min(1440px,calc(100% - 2rem));margin-left:auto;margin-right:auto">
        <div><strong>Secure checkout</strong><span>Encrypted card, bank and USSD payments.</span></div>
        <div><strong>Order tracking</strong><span>Follow your order from payment to delivery.</span></div>
        <div><strong>Live stock</strong><span>Availability comes straight from the catalog.</span></div>
    </div>

    <section class="section newsletter-section">
        <div class="container">
            <div class="newsletter-panel">
                <h2>Stay in the loop</h2>
                <p class="newsletter-description">Get new arrival alerts, pricing updates, and secure-delivery reminders from the live catalog.</p>
                <form class="newsletter-form" onsubmit="return false;">
                    <input id="newsletter-email" class="newsletter-input" type="email" placeholder="Email address" aria-label="Email address for newsletter">
                    <button id="newsletter-btn" class="btn btn-primary" type="button">Join updates</button>
                </form>
            </div>
        </div>
    </section>

    <footer data-shared-footer></footer>
<script src="/js/runtime-env.js"></script>
    <script src="/js/env.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/flutterwave.js"></script>
    <script src="/js/email-service.js"></script>
    <script src="/js/site-header.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/home-browse.js"></script>
    <script src="/js/luxury-ui.js"></script>
</body>
</html>
